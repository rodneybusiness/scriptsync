<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18181b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="ScriptSync - Professional screenplay development and analysis tool" />
    <title>ScriptSync</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            screens: {
              'xs': '375px',
              'sm': '640px',
              'md': '768px',
              'lg': '1024px',
              'xl': '1280px',
              '2xl': '1536px',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'Menlo', 'monospace'],
              script: ['Courier Prime', 'Courier New', 'monospace'],
            },
            colors: {
              scriptsync: {
                primary: '#3b82f6',
                secondary: '#8b5cf6',
                success: '#22c55e',
                warning: '#f59e0b',
                danger: '#ef4444',
              }
            },
            spacing: {
              'safe-top': 'env(safe-area-inset-top)',
              'safe-bottom': 'env(safe-area-inset-bottom)',
              'safe-left': 'env(safe-area-inset-left)',
              'safe-right': 'env(safe-area-inset-right)',
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap');

      /* Base styles */
      * {
        -webkit-tap-highlight-color: transparent;
      }

      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .font-mono {
        font-family: 'JetBrains Mono', Menlo, monospace;
      }

      .font-script {
        font-family: 'Courier Prime', 'Courier New', monospace;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b;
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b;
      }

      /* Hide scrollbar on mobile */
      @media (max-width: 768px) {
        ::-webkit-scrollbar {
          width: 4px;
          height: 4px;
        }
      }

      /* Safe area support for notched devices */
      .safe-area-top {
        padding-top: env(safe-area-inset-top);
      }
      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .safe-area-left {
        padding-left: env(safe-area-inset-left);
      }
      .safe-area-right {
        padding-right: env(safe-area-inset-right);
      }

      /* Mobile-optimized touch targets */
      @media (max-width: 768px) {
        button,
        a,
        input[type="button"],
        input[type="submit"],
        [role="button"] {
          min-height: 44px;
          min-width: 44px;
        }

        /* Larger touch targets for interactive elements */
        .touch-target {
          position: relative;
        }
        .touch-target::after {
          content: '';
          position: absolute;
          top: -8px;
          left: -8px;
          right: -8px;
          bottom: -8px;
        }
      }

      /* Prevent text selection on UI elements */
      .no-select {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      /* Smooth transitions for theme/layout changes */
      .transition-layout {
        transition: all 0.2s ease-out;
      }

      /* Mobile drawer animations */
      .drawer-enter {
        transform: translateX(-100%);
      }
      .drawer-enter-active {
        transform: translateX(0);
        transition: transform 0.3s ease-out;
      }
      .drawer-exit {
        transform: translateX(0);
      }
      .drawer-exit-active {
        transform: translateX(-100%);
        transition: transform 0.3s ease-in;
      }

      /* Bottom sheet animations for mobile */
      .bottom-sheet-enter {
        transform: translateY(100%);
      }
      .bottom-sheet-enter-active {
        transform: translateY(0);
        transition: transform 0.3s ease-out;
      }
      .bottom-sheet-exit {
        transform: translateY(0);
      }
      .bottom-sheet-exit-active {
        transform: translateY(100%);
        transition: transform 0.3s ease-in;
      }

      /* Prevent body scroll when modal is open */
      body.modal-open {
        overflow: hidden;
        position: fixed;
        width: 100%;
      }

      /* Mobile keyboard handling */
      @media (max-width: 768px) {
        input:focus,
        textarea:focus {
          font-size: 16px; /* Prevents iOS zoom on input focus */
        }
      }

      /* Loading animation */
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .animate-pulse-glow {
        animation: pulse-glow 2s ease-in-out infinite;
      }

      /* Screenplay-specific styles */
      .script-line {
        line-height: 1.5;
        margin-bottom: 0.5rem;
      }
      .script-line.character {
        text-transform: uppercase;
        margin-left: 2.5rem;
        margin-bottom: 0;
      }
      .script-line.dialogue {
        margin-left: 1.5rem;
        margin-right: 1.5rem;
      }
      .script-line.parenthetical {
        margin-left: 2rem;
        margin-right: 2rem;
        font-style: italic;
      }
      .script-line.action {
        margin-bottom: 1rem;
      }
      .script-line.scene-heading {
        text-transform: uppercase;
        font-weight: bold;
        margin-top: 1.5rem;
        margin-bottom: 0.5rem;
      }

      /* Mobile script view adjustments */
      @media (max-width: 640px) {
        .script-line.character {
          margin-left: 1.5rem;
        }
        .script-line.dialogue {
          margin-left: 0.5rem;
          margin-right: 0.5rem;
        }
        .script-line.parenthetical {
          margin-left: 1rem;
          margin-right: 1rem;
        }
      }

      /* Accessibility: Screen reader only */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Accessibility: Reduced motion */
      .reduce-motion *,
      .reduce-motion *::before,
      .reduce-motion *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      /* Accessibility: High contrast mode */
      .high-contrast * {
        border-color: currentColor !important;
      }
      .high-contrast .text-zinc-400,
      .high-contrast .text-zinc-500,
      .high-contrast .text-zinc-600 {
        color: #a1a1aa !important; /* zinc-400 for better contrast */
      }

      /* Focus visible styles */
      :focus-visible {
        outline: 2px solid #3b82f6;
        outline-offset: 2px;
      }

      /* Skip link styles - shown on focus */
      .focus\\:not-sr-only:focus {
        position: fixed;
        width: auto;
        height: auto;
        padding: 0.5rem 1rem;
        margin: 0;
        overflow: visible;
        clip: auto;
        white-space: normal;
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100 safe-area-top safe-area-bottom">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
